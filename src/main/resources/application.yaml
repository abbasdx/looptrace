spring:
  application:
    name: looptrace
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

looptrace:
  seed-demo: false
  admin:
    api-key: ${LOOPTRACE_ADMIN_API_KEY:}
  ai:
    model-id: ${GEMINI_MODEL_ID:gemini-3.5-flash-lite}
    api-key: ${GEMINI_API_KEY:}
  auth:
    enabled: ${LOOPTRACE_AUTH_ENABLED:true}
    jwt-secret: ${LOOPTRACE_JWT_SECRET:?LOOPTRACE_JWT_SECRET must be configured}
    access-token-minutes: ${LOOPTRACE_ACCESS_TOKEN_MINUTES:30}
  storage:
    bucket: ${LOOPTRACE_S3_BUCKET:${AWS_S3_BUCKET:}}
    region: ${AWS_REGION:ap-south-1}